name: Build Hekpixle (C++)

# Actions tab -> "Build Hekpixle (C++)" -> Run workflow. Download "Hekpixle-win64" from Artifacts.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Package
        shell: pwsh
        run: |
          if (-not (Test-Path build/out/Hekpixle.exe)) { throw "Hekpixle.exe not found" }
          Compress-Archive -Path build/out/* -DestinationPath Hekpixle-win64.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: Hekpixle-win64
          path: build/out/
          if-no-files-found: error
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: Hekpixle-win64.zip
